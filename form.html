<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Review Form | WDD 131</title>
  <meta name="description" content="Product Review Form assignment for WDD 131 Dynamic Web Fundamentals.">
  <meta name="author" content="Margareth Ramos">
  <link rel="stylesheet" href="styles/form.css">
  <script src="scripts/form.js" defer></script>
</head>
<body>
  <header>
    <h1>Product Review Form</h1>
  </header>

  <main>
    <form method="get" action="review.html">
      
      <!-- Product Selection -->
      <div class="form-item">
        <label for="prod-name">Product Name <span class="req">*</span></label>
        <select id="prod-name" name="prod-name" required>
          <option value="" disabled selected>Select a Product ...</option>
        </select>
      </div>

      <!-- Overall Rating -->
      <fieldset class="form-item">
        <legend>Overall Rating <span class="req">*</span></legend>
        <div class="rating">
          <input type="radio" id="star5" name="rating" value="5" required>
          <label for="star5" title="5 stars">☆</label>

          <input type="radio" id="star4" name="rating" value="4" required>
          <label for="star4" title="4 stars">☆</label>

          <input type="radio" id="star3" name="rating" value="3" required>
          <label for="star3" title="3 stars">☆</label>

          <input type="radio" id="star2" name="rating" value="2" required>
          <label for="star2" title="2 stars">☆</label>

          <input type="radio" id="star1" name="rating" value="1" required>
          <label for="star1" title="1 star">☆</label>
        </div>
      </fieldset>

      <!-- Date of Installation -->
      <div class="form-item">
        <label for="install-date">Date of Installation <span class="req">*</span></label>
        <input type="date" id="install-date" name="install-date" required>
      </div>

      <!-- Useful Features -->
      <fieldset class="form-item">
        <legend>Which features did you find useful? (Check all that apply)</legend>
        
        <div class="checkbox-item">
          <input type="checkbox" id="ft-durability" name="features" value="durability">
          <label for="ft-durability">Durability</label>
        </div>

        <div class="checkbox-item">
          <input type="checkbox" id="ft-ease" name="features" value="ease-of-use">
          <label for="ft-ease">Ease of Use</label>
        </div>

        <div class="checkbox-item">
          <input type="checkbox" id="ft-performance" name="features" value="performance">
          <label for="ft-performance">Performance</label>
        </div>

        <div class="checkbox-item">
          <input type="checkbox" id="ft-design" name="features" value="design">
          <label for="ft-design">Design</label>
        </div>
      </fieldset>

      <!-- Written Review -->
      <div class="form-item">
        <label for="written-review">Written Review (Optional)</label>
        <textarea id="written-review" name="written-review" rows="4" placeholder="Write your review..."></textarea>
      </div>

      <!-- User Name -->
      <div class="form-item">
        <label for="user-name">Your Name (Optional)</label>
        <input type="text" id="user-name" name="user-name" placeholder="John Doe">
      </div>

      <!-- Submit Button -->
      <input type="submit" value="Post Review" class="btn">

    </form>
  </main>

  <footer>
    <p>&copy; <span id="currentyear"></span> | Margareth Ramos | Honduras</p>
    <p id="lastModified"></p>
  </footer>
</body>
</html>
