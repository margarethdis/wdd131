<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" aria-label="Camino a Políglota Logo">
  <!-- Fondo de Sello / Estampa -->
  <g transform="translate(5, 5)">
    <!-- Círculo exterior con borde de guiones (Sello postal) -->
    <circle cx="25" cy="25" r="22" fill="none" stroke="#B23A2E" stroke-width="2" stroke-dasharray="4 2" />
    
    <!-- Círculo interior -->
    <circle cx="25" cy="25" r="17" fill="none" stroke="#C79A3E" stroke-width="1.5" />
    
    <!-- Ícono de Pasaporte / Brújula central -->
    <path d="M25 12 L28 22 L38 25 L28 28 L25 38 L22 28 L12 25 L22 22 Z" fill="#B23A2E" />
    <circle cx="25" cy="25" r="3" fill="#FAF3E6" />
  </g>

  <!-- Tipografía del Logo -->
  <text x="62" y="32" font-family="'Fraunces', Georgia, serif" font-size="20" font-weight="700" fill="#1C2B39">
    Camino a Políglota
  </text>
  
  <text x="62" y="47" font-family="'IBM Plex Mono', monospace" font-size="9" font-weight="700" fill="#B23A2E" letter-spacing="1.5">
    PASSPORT OF PROGRESS
  </text>
</svg>
