<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Get in touch with Margareth Ramos and share your language learning journey.">
  <title>Camino a Políglota | Contact</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;700&family=IBM+Plex+Mono:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="styles/main.css">
  <script src="scripts/main.js" defer></script>
</head>
<body>
  <header>
    <div class="header-container">
      <a href="index.html" class="logo">Camino a Políglota</a>
      <button id="menu-btn" aria-label="Toggle navigation menu">☰</button>
      <nav id="nav-menu">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="languages.html">Languages & Methods</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="form-page">
    <h1>Have questions or want to connect?</h1>
    <p>Fill out the form below to share your experience or ask about language study methods.</p>

    <form id="contact-form" action="#" method="get">
      <fieldset>
        <legend>Personal Information</legend>
        
        <label for="fullname">Full Name *</label>
        <input type="text" id="fullname" name="fullname" required placeholder="e.g., Margareth Ramos">

        <label for="email">Email Address *</label>
        <input type="email" id="email" name="email" required placeholder="user@example.com">

        <label for="target-lang">Language of Interest</label>
        <select id="target-lang" name="target-lang">
          <option value="english">English</option>
          <option value="french">French</option>
          <option value="japanese">Japanese</option>
          <option value="italian">Italian</option>
        </select>
      </fieldset>

      <fieldset>
        <legend>Your Message</legend>
        
        <label for="message">Your Experience or Question *</label>
        <textarea id="message" name="message" rows="5" required></textarea>
      </fieldset>

      <button type="submit" class="btn-submit">Send Message</button>
    </form>
    
    <div id="form-feedback" class="feedback-msg"></div>
  </main>

  <footer>
    <p>&copy; <span id="year"></span> Camino a Políglota · Margareth Ramos</p>
    <p><a href="references.html">Resource & Image References</a></p>
  </footer>
</body>
</html>
